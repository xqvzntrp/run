services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-oracle}
      APP_USER: ${ORACLE_USER:-workflow}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-workflow}
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
